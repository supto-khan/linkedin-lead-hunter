<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadHunter Radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="radar-indicator" id="radarPulse"></div>
        <div class="brand-text">
          <h1>LeadHunter</h1>
          <span class="badge-tag">Radar Active</span>
        </div>
      </div>
      <div class="radar-toggle-wrapper">
        <label class="switch" title="Toggle LinkedIn Radar">
          <input type="checkbox" id="radarToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-value" id="statLeads">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          Total Leads
        </span>
      </div>
      <div class="metric-card hot">
        <span class="metric-value" id="statHot">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path></svg>
          Hot Leads
        </span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="statEmails">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          Emails
        </span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="statScanned">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Scanned
        </span>
      </div>
    </div>

    <!-- Recent Leads Section -->
    <div class="section-header">
      <h2>Recent Hot Leads</h2>
      <span class="section-hint" id="newLeadsCount">0 new</span>
    </div>

    <div class="recent-leads-list" id="recentLeadsList">
      <div class="empty-state">
        <p>No leads detected yet.</p>
        <small>Scroll your LinkedIn feed to start catching leads automatically!</small>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="footer-actions">
      <button class="btn btn-primary" id="openDashboardBtn">
        <span>Open Lead Dashboard & CRM</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
