<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadHunter Radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="radar-indicator" id="radarPulse"></div>
        <div class="brand-text">
          <h1>LeadHunter</h1>
          <span class="badge-tag">Radar Active</span>
        </div>
      </div>
      <div class="radar-toggle-wrapper">
        <label class="switch" title="Toggle LinkedIn Radar">
          <input type="checkbox" id="radarToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-value" id="statLeads">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          Total Leads
        </span>
      </div>
      <div class="metric-card hot">
        <span class="metric-value" id="statHot">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path></svg>
          Hot Leads
        </span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="statEmails">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          Emails
        </span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="statScanned">0</span>
        <span class="metric-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Scanned
        </span>
      </div>
    </div>

    <!-- Smart Auto-Scroll Section -->
    <div class="scroll-card">
      <div class="scroll-card-header">
        <div class="scroll-title-group">
          <div class="scroll-icon-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18M17 8l-5-5-5 5M17 16l-5 5-5-5"/>
            </svg>
          </div>
          <div class="scroll-title-text">
            <h3>Smart Auto-Scroll</h3>
            <span class="scroll-subtext">Autonomous feed scanner</span>
          </div>
        </div>
        <span class="scroll-status-badge" id="scrollStatusBadge">Idle</span>
      </div>

      <!-- Mode Segmented Control Switch -->
      <div class="mode-segmented-control">
        <label class="mode-segment">
          <input type="radio" name="scrollMode" value="infinite" checked id="modeInfinite">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Continuous Loop</span>
        </label>
        <label class="mode-segment">
          <input type="radio" name="scrollMode" value="single" id="modeSingle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 14 14"/></svg>
          <span>Single Step</span>
        </label>
      </div>

      <!-- Controls Grid -->
      <div class="scroll-controls">
        <div class="control-row">
          <div class="control-label-group">
            <label for="scrollDistance">Scroll Distance</label>
            <span class="control-val-display" id="scrollDistanceVal">500 px</span>
          </div>
          <div class="range-wrapper">
            <input type="range" id="scrollDistance" min="100" max="1500" step="50" value="500">
          </div>
        </div>

        <div class="control-row">
          <div class="control-label-group">
            <label for="scrollDelay">Scroll Delay</label>
            <span class="control-val-display" id="scrollDelayVal">2.0 s</span>
          </div>
          <div class="range-wrapper">
            <input type="range" id="scrollDelay" min="0.5" max="10.0" step="0.5" value="2.0">
          </div>
        </div>

        <!-- Stop Options Row -->
        <div class="stop-rules-row">
          <label class="custom-checkbox-label" title="Automatically stop when bottom of feed is reached">
            <input type="checkbox" id="stopOnBottom">
            <span class="custom-checkbox-box">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span>Stop on Bottom</span>
          </label>
          <div class="limit-input-group" title="Set scroll limit (0 or empty = unlimited)">
            <span class="limit-label">Max:</span>
            <input type="number" id="maxScrollsInput" min="0" max="1000" placeholder="∞" value="0">
          </div>
        </div>
      </div>

      <!-- Live Telemetry Stats -->
      <div class="scroll-telemetry" id="scrollTelemetry" style="display: none;">
        <div class="telemetry-item">
          <span class="telemetry-num" id="telemetryScrolls">0</span>
          <span class="telemetry-lbl">Scrolls</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-num" id="telemetryMutations">0</span>
          <span class="telemetry-lbl">Activity</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-num" id="telemetryElapsed">00:00</span>
          <span class="telemetry-lbl">Elapsed</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="scroll-actions">
        <button class="btn btn-scroll-toggle" id="scrollToggleBtn">
          <svg class="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          <span id="scrollToggleText">Start Smart Scroll</span>
        </button>
        <button class="btn btn-scroll-step" id="scrollStepBtn" title="Scroll down once by configured distance">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          <span>Step Once</span>
        </button>
      </div>
    </div>

    <!-- Recent Leads Section -->
    <div class="section-header">
      <h2>Recent Hot Leads</h2>
      <span class="section-hint" id="newLeadsCount">0 new</span>
    </div>

    <div class="recent-leads-list" id="recentLeadsList">
      <div class="empty-state">
        <p>No leads detected yet.</p>
        <small>Scroll your LinkedIn feed to start catching leads automatically!</small>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="footer-actions">
      <button class="btn btn-primary" id="openDashboardBtn">
        <span>Open Lead Dashboard & CRM</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
